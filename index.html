<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sync Our Soul - Final</title>
<style>
:root{--bg:#0b0f19;--card:#151c2c;--accent:#e11d48;--gold:#fbbf24;--border:#2a364f;--sub:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui;background:var(--bg);color:#fff;display:flex;justify-content:center;padding:12px}
.container{width:100%;max-width:580px;background:var(--card);padding:20px;border-radius:24px;border:1px solid var(--border)}
h1{text-align:center;color:var(--accent);font-size:26px}
.tag{color:var(--gold);text-align:center;margin:8px 0 15px;font-size:13px}
input{width:100%;padding:13px;border-radius:12px;background:#0b0f19;border:1.5px solid var(--border);color:#fff;margin-bottom:8px}
.btn{width:100%;padding:14px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;margin-top:8px}
.btn-sec{background:#334155}
.mode-btn{display:block;width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid var(--border);background:#0b0f19;color:#fff;cursor:pointer;text-align:left}
.mode-btn:hover{border-color:var(--accent)}
.hidden{display:none!important}
.room{background:#0b0f19;padding:12px;text-align:center;color:var(--gold);font-weight:bold;letter-spacing:2px;border-radius:12px;border:1px solid var(--border);margin:10px 0}
.progress{width:100%;height:8px;background:#0b0f19;border-radius:10px;overflow:hidden;margin-bottom:12px}
.bar{height:100%;width:0%;background:var(--accent);transition:.3s}
.opt{background:#0b0f19;border:1.5px solid var(--border);padding:12px;border-radius:12px;margin-bottom:8px;width:100%;text-align:left;color:#fff;cursor:pointer}
.opt.sel{border-color:var(--accent);background:rgba(225,29,72,.15)}
.box{background:#0b0f19;padding:12px;border-radius:12px;border:1px solid var(--border);margin-top:8px}
</style>
</head>
<body>
<div class="container">
  <!-- AUTH -->
  <div id="home">
    <h1>✨ Sync Our Soul</h1>
    <p class="tag">100 Kesyon | Pwofil ak Password | Solo & Koup</p>
    
    <div id="auth-box" class="box">
      <h3 style="text-align:center;margin-bottom:10px">👤 Kont mwen</h3>
      <input id="user-name" type="text" placeholder="Non ou ex Jean">
      <input id="user-pass" type="password" placeholder="Password ex 1234">
      <div style="display:flex;gap:8px">
        <button class="btn" style="flex:1" onclick="register()">Kreye kont</button>
        <button class="btn btn-sec" style="flex:1" onclick="login()">Konekte</button>
      </div>
      <p id="auth-msg" style="text-align:center;margin-top:8px;color:var(--gold);font-size:13px"></p>
    </div>

    <div id="game-buttons" class="hidden">
      <p id="welcome" style="text-align:center;color:#22c55e;margin:10px 0"></p>
      
      <label style="font-size:13px;color:var(--sub)">Konbyen kesyon ou vle jwe?</label>
      <select id="q-count" style="width:100%;padding:12px;border-radius:10px;background:#0b0f19;border:1px solid var(--border);color:#fff;margin:5px 0 10px">
        <option value="10">10 Kesyon - Rapid</option>
        <option value="20" selected>20 Kesyon - Nomal</option>
        <option value="50">50 Kesyon - Pwofon</option>
        <option value="100">100 Kesyon - Total</option>
      </select>

      <button class="mode-btn" onclick="setMode('couple')">💑 JWE AK KOUP - Kreye chanm</button>
      <button class="mode-btn" onclick="setMode('solo')">🧘 JWE SOLO - Gerizon tet ou</button>
      <button class="mode-btn" onclick="showProfile()">📜 PWOFL MWEN - Istorik</button>
      <button class="mode-btn" onclick="logout()" style="border-color:#e11d48">🚪 Dekonekte</button>

      <div style="margin-top:12px">
        <input id="join-code" placeholder="SYNC-XXXX pou rantre nan chanm patne w">
        <button class="btn btn-sec" onclick="joinRoom()">Rantre ak Kod</button>
      </div>
    </div>
  </div>

  <!-- INVITE -->
  <div id="invite" class="hidden">
    <h2 style="text-align:center;color:var(--accent)">Chanm Pare!</h2>
    <div id="code" class="room">SYNC-XXXX</div>
    <button class="btn btn-sec" onclick="copyInvite()">📋 Kopye Envitasyon</button>
    <button class="btn" onclick="startCouple()">Komanse Jwet la 👉</button>
    <button class="btn btn-sec" onclick="location.reload()">Retounen</button>
  </div>

  <!-- GAME -->
  <div id="game" class="hidden">
    <div class="progress"><div id="bar" class="bar"></div></div>
    <span id="cat" style="font-size:12px;color:var(--gold)"></span>
    <h2 id="qtext" style="margin:12px 0;font-size:18px"></h2>
    <div id="opts"></div>
    <div id="customBox" class="hidden"><input id="customInput" placeholder="Ekri pa w..."></div>
    <button class="btn" id="submit">Valide repons lan</button>
    <div id="wait" class="hidden" style="text-align:center;margin-top:10px;color:var(--sub)">⏳ Ap tann patne w...</div>
  </div>

  <!-- RESULT -->
  <div id="result" class="hidden">
    <h1 style="text-align:center">🎉 Bilan</h1>
    <div id="score" style="text-align:center;background:linear-gradient(135deg,#e11d48,#881337);padding:18px;border-radius:16px;margin:12px 0"></div>
    <div id="summary"></div>
    <button class="btn" onclick="location.reload()">Rekomanse</button>
    <button class="btn btn-sec" onclick="showProfile()">We Pwofil mwen</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
const firebaseConfig={databaseURL:"https://syncoursoul-default-rtdb.firebaseio.com"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let currentUser=null, currentRoom="", isHost=false, qIndex=0, allQuestions=[], answers=[], mode="solo";

function register(){
  let name=document.getElementById("user-name").value.trim();
  let pass=document.getElementById("user-pass").value.trim();
  if(!name || !pass) return alert("Mete non ak password");
  if(pass.length<4) return alert("Password dwe gen omwen 4 karakte");
  db.ref("users/"+name+"/profile").once("value").then(s=>{
    if(s.exists()){ document.getElementById("auth-msg").innerText="Non sa deja pran, fe Konekte"; return; }
    db.ref("users/"+name+"/profile").set({name:name,password:pass,created:Date.now(),lastSeen:Date.now()}).then(()=>{
      currentUser=name; document.getElementById("auth-msg").innerText="Kont kreye! Byenveni "+name; unlock();
    });
  });
}
function login(){
  let name=document.getElementById("user-name").value.trim();
  let pass=document.getElementById("user-pass").value.trim();
  if(!name || !pass) return alert("Mete non ak password");
  db.ref("users/"+name+"/profile").once("value").then(s=>{
    if(!s.exists()){ document.getElementById("auth-msg").innerText="Kont pa jwenn"; return; }
    if(s.val().password!==pass){ document.getElementById("auth-msg").innerText="Password pa bon"; return; }
    currentUser=name;
    db.ref("users/"+name+"/profile/lastSeen").set(Date.now());
    document.getElementById("auth-msg").innerText="Byenveni "+name;
    unlock();
  });
}
function unlock(){
  document.getElementById("game-buttons").classList.remove("hidden");
  document.getElementById("welcome").innerText="Konekte kòm "+currentUser+" ✅";
  document.getElementById("auth-box").style.borderColor="#22c55e";
  localStorage.setItem("sync_user", currentUser);
}
function logout(){
  currentUser=null; localStorage.removeItem("sync_user");
  document.getElementById("game-buttons").classList.add("hidden");
  document.getElementById("auth-box").style.borderColor="var(--border)";
  document.getElementById("auth-msg").innerText="Dekonekte";
  document.getElementById("user-name").value=""; document.getElementById("user-pass").value="";
}
function setMode(m){
  mode=m;
  let count=parseInt(document.getElementById("q-count").value);
  db.ref("questions").once("value").then(s=>{
    let all=Object.values(s.val()||{});
    if(all.length===0) return alert("Pa gen kesyon nan Firebase");
    // filtre selon mode
    if(m==="solo") all=all.filter(q=>q.type==="solo"||q.type==="both");
    allQuestions=all.sort(()=>0.5-Math.random()).slice(0,count);
    if(m==="couple"){
      currentRoom="SYNC-"+Math.floor(1000+Math.random()*9000);
      isHost=true;
      document.getElementById("code").innerText=currentRoom;
      document.getElementById("home").classList.add("hidden");
      document.getElementById("invite").classList.remove("hidden");
      db.ref("rooms/"+currentRoom).set({qIndex:0,p1_name:currentUser,questions:allQuestions});
    } else {
      document.getElementById("home").classList.add("hidden");
      document.getElementById("game").classList.remove("hidden");
      qIndex=0; answers=[]; loadQ();
    }
  });
}
function joinRoom(){
  let code=document.getElementById("join-code").value.trim().toUpperCase();
  if(!code || !currentUser) return alert("Konekte epi mete kod SYNC-XXXX");
  currentRoom=code; isHost=false;
  document.getElementById("home").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  db.ref("rooms/"+currentRoom).once("value").then(s=>{
    if(!s.exists()) return alert("Chanm pa jwenn");
    allQuestions=s.val().questions||[];
    listenCouple(); loadQ();
  });
}
function startCouple(){
  document.getElementById("invite").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  listenCouple(); loadQ();
}
function listenCouple(){
  db.ref("rooms/"+currentRoom+"/qIndex").on("value",s=>{ if(s.val()!==null){ qIndex=s.val(); loadQ(); }});
  db.ref("rooms/"+currentRoom+"/answers").on("value",s=>{
    let all=s.val(); if(!all) return;
    let cur=all["q"+qIndex];
    if(cur && cur.p1 && cur.p2){
      let next=qIndex+1;
      if(next<allQuestions.length){ if(isHost) db.ref("rooms/"+currentRoom+"/qIndex").set(next); }
      else { showCoupleResult(all); }
    }
  });
}
let sel=null;
function loadQ(){
  if(qIndex>=allQuestions.length){ if(mode==="solo") showSoloResult(); return; }
  let q=allQuestions[qIndex];
  document.getElementById("bar").style.width=((qIndex+1)/allQuestions.length*100)+"%";
  document.getElementById("cat").innerText=q.cat+" ("+(qIndex+1)+"/"+allQuestions.length+")";
  document.getElementById("qtext").innerText=q.q;
  let cont=document.getElementById("opts"); cont.innerHTML=""; sel=null;
  document.getElementById("customBox").classList.add("hidden");
  document.getElementById("wait").classList.add("hidden");
  document.getElementById("submit").disabled=false;
  q.opts.forEach((o,i)=>{
    let b=document.createElement("button"); b.className="opt"; b.innerText=o;
    b.onclick=()=>{ document.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); sel=i;
      if(i===3) document.getElementById("customBox").classList.remove("hidden"); else document.getElementById("customBox").classList.add("hidden");
    }; cont.appendChild(b);
  });
}
document.getElementById("submit").onclick=()=>{
  if(sel===null) return alert("Chwazi yon repons");
  let custom=document.getElementById("customInput").value.trim();
  if(mode==="solo"){
    answers.push({q:allQuestions[qIndex],opt:sel,text:custom});
    qIndex++; if(qIndex<allQuestions.length) loadQ(); else showSoloResult();
    document.getElementById("customInput").value=""; return;
  }
  let key=isHost?"p1":"p2";
  db.ref(`rooms/${currentRoom}/answers/q${qIndex}/${key}`).set({opt:sel,text:custom,name:currentUser});
  document.getElementById("wait").classList.remove("hidden");
  document.getElementById("submit").disabled=true;
  document.getElementById("customInput").value="";
};
function showSoloResult(){
  document.getElementById("game").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");
  let html=""; answers.forEach(a=>{ html+=`<div class="box" style="border-left:4px solid var(--gold)"><b>${a.q.cat} - ${a.q.q}</b><br>Repons: ${a.q.opts[a.opt]} ${a.text?" => "+a.text:""}</div>`; });
  document.getElementById("score").innerHTML=`Analiz Solo - ${answers.length} repons<br><small>${currentUser} sou wout gerizon</small>`;
  document.getElementById("summary").innerHTML=html;
  db.ref(`users/${currentUser}/history`).push({date:Date.now(),mode:"solo",score:answers.length,total:allQuestions.length});
}
function showCoupleResult(all){
  document.getElementById("game").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");
  let html="", same=0;
  Object.keys(all).forEach(k=>{
    let qa=all[k]; let qi=parseInt(k.replace("q","")); let q=allQuestions[qi];
    if(qa.p1.opt===qa.p2.opt) same++;
    html+=`<div class="box" style="border-left:4px solid var(--accent)"><b>${q.q}</b><br>${qa.p1.name}: ${q.opts[qa.p1.opt]} ${qa.p1.text?" => "+qa.p1.text:""}<br>${qa.p2.name}: ${q.opts[qa.p2.opt]} ${qa.p2.text?" => "+qa.p2.text:""}</div>`;
  });
  let pct=Math.round(same/allQuestions.length*100);
  document.getElementById("score").innerHTML=`${pct}% Konpatibilite<br><small>${same} repons menm sou ${allQuestions.length}</small>`;
  document.getElementById("summary").innerHTML=html;
  db.ref(`users/${currentUser}/history`).push({date:Date.now(),mode:"couple",score:pct,total:allQuestions.length,room:currentRoom});
}
function showProfile(){
  if(!currentUser){ let saved=localStorage.getItem("sync_user"); if(saved) currentUser=saved; else return alert("Konekte dabor"); }
  db.ref("users/"+currentUser).once("value").then(s=>{
    if(!s.exists()) return alert("Pwofil pa jwenn");
    let data=s.val(); let hist=data.history?Object.values(data.history):[];
    let html=`<div class="box"><b>Non:</b> ${data.profile.name}<br><b>Kreye:</b> ${new Date(data.profile.created).toLocaleString()}<br><b>Total jwet:</b> ${hist.length}</div>`;
    hist.reverse().slice(0,20).forEach(h=>{
      html+=`<div class="box">${new Date(h.date).toLocaleString()} - ${h.mode} - Score ${h.score}/${h.total||h.totalQuestions||"?"} ${h.room?" - "+h.room:""}</div>`;
    });
    document.getElementById("home").classList.add("hidden");
    document.getElementById("game").classList.add("hidden");
    document.getElementById("result").classList.remove("hidden");
    document.getElementById("score").innerHTML=`Pwofil ${currentUser}`;
    document.getElementById("summary").innerHTML=html;
  });
}
function copyInvite(){
  let link=location.href.split("?")[0]+"?room="+currentRoom;
  navigator.clipboard.writeText("Antre nan Sync Our Soul! Kod: "+currentRoom+" Lien: "+link).then(()=>alert("Envitasyon kopye!"));
}
window.onload=()=>{
  let saved=localStorage.getItem("sync_user");
  if(saved){ document.getElementById("user-name").value=saved; document.getElementById("auth-msg").innerText="Dènye itilizatè: "+saved+" - mete password ou epi Konekte"; }
  let p=new URLSearchParams(location.search).get("room");
  if(p) document.getElementById("join-code").value=p;
};
</script>
</body>
</html>
