<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sync Our Soul</title>
<style>
/* ========= CSS ========= */
:root { --bg-color: #0b0f19; --card-bg: #151c2c; --accent-color: #e11d48; --accent-hover: #be123c; --text-color: #f8fafc; --subtext: #94a3b8; --border-color: #2a364f; --gold: #fbbf24; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg-color);color:var(--text-color);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:15px}
.container{width:100%;max-width:550px;background:var(--card-bg);padding:30px;border-radius:24px;border:1px solid var(--border-color)}
h1{text-align:center;color:var(--accent-color);font-size:2.2rem} .tagline{text-align:center;color:var(--gold);font-weight:600;margin-bottom:20px;text-transform:uppercase}
.intro-box{background:rgba(15,23,42,.6);padding:18px;border-radius:14px;border-left:4px solid var(--accent-color);margin-bottom:25px;color:#cbd5e1}
label{display:block;font-size:.9rem;font-weight:600;margin-top:15px;margin-bottom:6px;color:var(--subtext)}
input[type="text"]{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--border-color);background:#0b0f19;color:white;outline:none}
.btn{width:100%;background:var(--accent-color);color:white;border:none;padding:16px;border-radius:12px;font-size:1rem;cursor:pointer;margin-top:15px;font-weight:700}
.btn-secondary{background:#334155} .progress-bar-container{width:100%;background:#0b0f19;height:8px;border-radius:10px;margin-bottom:20px;overflow:hidden}
.progress-bar{height:100%;width:0%;background:var(--accent-color);transition:width .3s ease}
.option-btn{background:#0b0f19;color:var(--text-color);border:1.5px solid var(--border-color);padding:14px;border-radius:12px;margin-bottom:12px;text-align:left;width:100%;cursor:pointer}
.option-btn.selected{border-color:var(--accent-color);background:rgba(225,29,72,.15);font-weight:600}
.hidden{display:none!important} .category-badge{display:inline-block;background:rgba(251,191,36,.15);color:var(--gold);padding:6px 14px;border-radius:20px;font-size:.85rem;font-weight:600;margin-bottom:15px}
.question-title{font-size:1.2rem;margin-bottom:20px} .status-box{background:#0b0f19;padding:14px;border-radius:12px;text-align:center;color:var(--subtext);font-size:.9rem;margin-top:15px;border:1px dashed var(--accent-color)}
.room-display{background:#0b0f19;padding:15px;border-radius:12px;text-align:center;font-size:1.3rem;font-weight:bold;color:var(--gold);letter-spacing:2px;margin:10px 0;border:1px solid var(--border-color)}
.result-card{background:#0b0f19;padding:18px;border-radius:14px;margin-top:15px;border-left:4px solid var(--accent-color)}
.score-banner{text-align:center;background:linear-gradient(135deg,#e11d48,#881337);padding:22px;border-radius:16px;margin-bottom:20px} .score-banner h2{font-size:2.4rem}
</style>
</head>
<body>
<div class="container">
  <div id="welcome-screen">
    <h1>✨ Sync Our Soul</h1>
    <p class="tagline">Espas Entim ak Kominikasyon pou Koup</p>
    <label>Non pa w:</label><input type="text" id="user-name" placeholder="Antre non w">
    <div style="margin-top:20px;display:flex;gap:10px;">
      <button class="btn" id="btn-create">Lanse Yon Nouvo Chanm</button>
      <button class="btn btn-secondary" id="btn-show-join">Rantre ak yon Kòd</button>
    </div>
    <div id="join-code-box" class="hidden" style="margin-top:15px;">
      <input type="text" id="join-room-code" placeholder="SYNC-XXXX">
      <button class="btn" id="btn-join">Rantre</button>
    </div>
  </div>
  <div id="invite-screen" class="hidden">
    <h2 style="text-align:center;color:var(--accent-color)">Chanm Vityèl Ou Pare!</h2>
    <div id="generated-room-code" class="room-display">SYNC-XXXX</div>
    <button class="btn" id="btn-copy">📋 Kopye Envitasyon WhatsApp</button>
    <button class="btn btn-secondary" id="btn-start" style="margin-top:10px;">Kòmanse Kounye a 👉</button>
  </div>
  <div id="game-screen" class="hidden">
    <div class="progress-bar-container"><div id="progress-bar" class="progress-bar"></div></div>
    <span id="category-title" class="category-badge"></span>
    <h2 id="question-text" class="question-title"></h2>
    <div id="options-container"></div>
    <div id="custom-answer-box" class="hidden"><input type="text" id="custom-input" placeholder="Ekri pwòp repons pa w la..."></div>
    <button class="btn" id="submitBtn">Valide Repons Mwen</button>
    <div id="status-waiting" class="status-box hidden">⏳ Repons ou anrejistre! N ap tann patnè w la...</div>
  </div>
  <div id="results-screen" class="hidden">
    <h1>🎉 Soul Sync Bilan</h1>
    <div class="score-banner"><h2 id="score-text">100%</h2><p>Nivo Aliyman nou</p></div>
    <div id="final-summary"></div>
    <button class="btn" onclick="location.reload()" style="background:#334155;margin-top:20px">Fè Yon Lòt Sesyon</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
// ========= 1. CONFIG - Firebase =========
const firebaseConfig = { databaseURL: "https://syncoursoul-default-rtdb.firebaseio.com" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ========= 2. QUESTIONS - pa chaje index la ankò =========
const localQuestions = [
  { cat:"🧠 Santiman", q:"Lè m pran yon ti tan san m pa ekri w, kisa ki vin nan tèt ou?", opts:["M konprann ou okipe","M kòmanse enkyete m","M santi m manke w anpil","Ekri pa m"] },
  { cat:"🔥 Érotisme", q:"Kisa ki pi eksite w lè nou pa ansanm?", opts:["Apèl vidyo san tabou","Ti mesaj cho / vokal","Sonje pi bon moman kabann nou","Ekri pa m"] },
  { cat:"💬 Kominikasyon", q:"Kijan ou prefere nou rezoud yon ti kont?", opts:["Pale fas a fas kalm","Ekri pou evite blese","Pran yon poz epi tounen pale","Ekri pa m"] },
  { cat:"🌱 Konfyans", q:"Kisa ki fè w santi w plis an sekirite?", opts:["Lè w di m sa w santi vre","Aksyon chak jou","Fidèl ak transparan","Ekri pa m"] },
  { cat:"💖 Langaj Lanmou", q:"Kijan ou santi w pi renmen?", opts:["Mo dous","Kado ak atansyon","Tan kalite san telefòn","Ekri pa m"] },
  { cat:"🔥 Dezir Kache", q:"Yon bagay ou ta renmen eseye avè m?", opts:["Jwèt wòl / fantasme","Yon kote diferan","Pale pi sal pandan entimite","Ekri pa m"] },
  { cat:"🏠 Fiti", q:"Kote ou wè nou nan 2 an?", opts:["Abite ansanm / marye","Bati biznis ansanm","Vwayaje mond lan","Ekri pa m"] },
  { cat:"😡 Limit", q:"Kisa ki ka fè w fache nèt?", opts:["Manti","Mank respè devan moun","Mank atansyon","Ekri pa m"] },
  { cat:"🌙 Entimite", q:"Ki moman ou te santi w pi konekte avè m?", opts:["Lè nou te kriye / ri ansanm","Apre lanmou nou pale","Lè ou te soutni m","Ekri pa m"] },
  { cat:"✨ Sipriz", q:"Ki sipriz ki ta fè kè w bat pi fò?", opts:["Yon vwayaj","Yon lèt lanmou","Yon nwit jis pou nou de","Ekri pa m"] },
];

// ========= 3. DATABASE - tout apèl Firebase yo =========
const DB = {
  createRoom: (code, name) => db.ref("rooms/"+code).set({status:"waiting", qIndex:0, p1_name:name}),
  getQuestions: async () => {
    try{ const s=await db.ref("questions").once("value"); if(s.exists()) return Object.values(s.val()); }catch(e){}
    return localQuestions;
  },
  saveAnswer: (room, qi, pKey, data) => db.ref(`rooms/${room}/answers/q${qi}/${pKey}`).set(data),
  listenQIndex: (room, cb) => db.ref("rooms/"+room+"/qIndex").on("value", s=>{ if(s.val()!==null) cb(s.val()); }),
  listenAnswers: (room, cb) => db.ref("rooms/"+room+"/answers").on("value", s=> cb(s.val())),
  setNext: (room, next) => db.ref("rooms/"+room+"/qIndex").set(next)
};

// ========= 4. APP - lojik la =========
let currentRoom="", userName="", selectedOptionIndex=null, isHost=false, currentQIndex=0, allQuestions=[];

document.getElementById("btn-create").onclick=createNewRoom;
document.getElementById("btn-show-join").onclick=()=>document.getElementById("join-code-box").classList.toggle("hidden");
document.getElementById("btn-join").onclick=joinRoomWithCode;
document.getElementById("btn-copy").onclick=copyInvitation;
document.getElementById("btn-start").onclick=startGameSession;
document.getElementById("submitBtn").onclick=submitAnswer;

function createNewRoom(){
  userName=document.getElementById("user-name").value.trim();
  if(!userName) return alert("Antre non w!");
  isHost=true;
  currentRoom="SYNC-"+Math.floor(1000+Math.random()*9000);
  document.getElementById("generated-room-code").innerText=currentRoom;
  document.getElementById("welcome-screen").classList.add("hidden");
  document.getElementById("invite-screen").classList.remove("hidden");
  DB.createRoom(currentRoom, userName);
}
function joinRoomWithCode(){
  userName=document.getElementById("user-name").value.trim();
  const code=document.getElementById("join-room-code").value.trim().toUpperCase();
  if(!userName||!code) return alert("Antre non ak kòd!");
  currentRoom=code; isHost=false; startGameSession();
}
function copyInvitation(){
  const link=location.href.split('?')[0]+"?room="+currentRoom;
  const txt=`Cheri, mwen envite w nan ✨ Sync Our Soul ✨\nKòd: *${currentRoom}*\nLyen: ${link}`;
  navigator.clipboard.writeText(txt).then(()=>alert("Envitasyon kopye!"));
}
async function startGameSession(){
  allQuestions=await DB.getQuestions();
  document.getElementById("welcome-screen").classList.add("hidden");
  document.getElementById("invite-screen").classList.add("hidden");
  document.getElementById("game-screen").classList.remove("hidden");
  DB.listenQIndex(currentRoom, idx=>{ currentQIndex=idx; loadQuestion(idx); });
  DB.listenAnswers(currentRoom, all=>{
    if(!all) return;
    const cur=all["q"+currentQIndex];
    if(cur && cur.p1 && cur.p2){
      const next=currentQIndex+1;
      if(next<allQuestions.length){ if(isHost) DB.setNext(currentRoom,next); }
      else{ showFinalResults(all); }
    }
  });
  loadQuestion(0);
}
function loadQuestion(idx){
  const qData=allQuestions[idx];
  document.getElementById("progress-bar").style.width=((idx+1)/allQuestions.length*100)+"%";
  document.getElementById("category-title").innerText=`${qData.cat} (${idx+1}/${allQuestions.length})`;
  document.getElementById("question-text").innerText=qData.q;
  const cont=document.getElementById("options-container"); cont.innerHTML="";
  selectedOptionIndex=null;
  document.getElementById("custom-answer-box").classList.add("hidden");
  document.getElementById("status-waiting").classList.add("hidden");
  document.getElementById("submitBtn").disabled=false;
  document.getElementById("custom-input").value="";
  qData.opts.forEach((opt,i)=>{
    const b=document.createElement("button"); b.className="option-btn"; b.innerText=opt;
    b.onclick=()=>{ document.querySelectorAll(".option-btn").forEach(x=>x.classList.remove("selected")); b.classList.add("selected"); selectedOptionIndex=i; if(i===3) document.getElementById("custom-answer-box").classList.remove("hidden"); else document.getElementById("custom-answer-box").classList.add("hidden"); };
    cont.appendChild(b);
  });
}
function submitAnswer(){
  if(selectedOptionIndex===null) return alert("Chwazi yon opsyon!");
  const custom=document.getElementById("custom-input").value.trim();
  const pKey=isHost?"p1":"p2";
  DB.saveAnswer(currentRoom, currentQIndex, pKey, {option:selectedOptionIndex, text:selectedOptionIndex===3?custom:"", name:userName, time:Date.now()});
  document.getElementById("status-waiting").classList.remove("hidden");
  document.getElementById("submitBtn").disabled=true;
}
function showFinalResults(all){
  document.getElementById("game-screen").classList.add("hidden");
  document.getElementById("results-screen").classList.remove("hidden");
  let html="", same=0;
  Object.keys(all).forEach(k=>{
    const qa=all[k]; const qi=parseInt(k.replace("q","")); const q=allQuestions[qi];
    if(qa.p1.option===qa.p2.option) same++;
    html+=`<div class="result-card"><h3 style="color:var(--gold)">${q.cat} - ${q.q}</h3><p><strong>${qa.p1.name}:</strong> ${q.opts[qa.p1.option]} ${qa.p1.text?`→ "${qa.p1.text}"`:``}</p><p><strong>${qa.p2.name}:</strong> ${q.opts[qa.p2.option]} ${qa.p2.text?`→ "${qa.p2.text}"`:``}</p></div>`;
  });
  document.getElementById("score-text").innerText=Math.round((same/allQuestions.length)*100)+"%";
  document.getElementById("final-summary").innerHTML=html;
}
window.onload=()=>{
  const p=new URLSearchParams(location.search).get('room');
  if(p){ document.getElementById("join-code-box").classList.remove("hidden"); document.getElementById("join-room-code").value=p; }
};
</script>
</body>
</html>
